[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=3D810E894A6CC08F9E17B78E7B8CEBA2
ProjectName=Top Down Game Template

; Explicit -ClientRole=<Role> overrides the project default, including Editor PIE.
; Video remains reserved for TASK-B; Standalone retains the legacy startup.
[CommandClient]
DefaultClientRole=Command

; ---- 后端网络配置 ----
; 外场换 IP 只需改这里，无需重新编译
[/Script/UE5DroneControl.DroneNetworkManager]
BackendBaseUrl="http://127.0.0.1:8080"
WebSocketUrl="ws://127.0.0.1:8081/ws"
PollIntervalSec=3.0
; h_ellipsoid = H_AMSL + GeoidSeparationMeters. Configure for the operating region.
GeoidSeparationMeters=0.0

[/Script/UE5DroneControl.UE5DroneControlCharacter]
FixedCameraPitch=-45.0
FixedCameraDistance=1500.0

; ---- Vertical ground-projection ray display ----
[DroneDisplay]
bShowGroundProjectionRay=true
; 0.0 = sparsest (2 m), 1.0 = exact legacy connected-curtain density.
GroundProjectionDensity=1.0

; Command presentation only; both modes use the same CesiumWorld and Registry.
[CommandMap]
DefaultMapMode=2D
; Existing Bing imagery is resolved by Cesium ion; authentication stays in the existing Cesium configuration.
BasemapIonAssetId=2
; Optional WGS84/WebMercator XYZ override. Use a quoted HTTP(S) URL with $z/$x/$y tokens.
; Keep credentials out of version control; set private URLs in a local config override.
; The existing GCJ02 Ovit plane remains configured under [CesiumTileServer] in DefaultEngine.ini.
BasemapUrl=

; Command owns this 2D WGS84 raster view; Main Map retains its independent Cesium camera.
[CommandTacticalMap]
BasemapUrl="https://tile.openstreetmap.org/{z}/{x}/{y}.png"
Attribution=Map data (c) OpenStreetMap contributors | openstreetmap.org/copyright

[Internationalization]
+LocalizationPaths=%GAMEDIR%Content/Localization/DroneOps
